[workspace]
resolver = "3"
members = ["crates/sememe-engine", "crates/sememe", "crates/sememe-model"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/sememe"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
debug = 1
codegen-units = 16

[profile.dev]
opt-level = 1
