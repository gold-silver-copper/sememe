[package]
name = "sememe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The sememe trainer: data, the owner process, the three-speed training loop, evaluation."

[lints]
workspace = true

[dependencies]
sememe-engine = { path = "../sememe-engine" }
sememe-data = { path = "../sememe-data" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
