[package]
name = "sememe-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Data preparation for sememe: the .docs format, BabyLM, BLiMP, enwik and UNPC prep"

[lints]
workspace = true

[lib]
name = "sememe_data"

[[bin]]
name = "sememe-data"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
